{% set name = "py-multihash" %}
{% set version = "4.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/py_multihash-{{ version }}.tar.gz
  sha256: 82d5302d7af1c4034809f50e44fd21c90aa5cc5e9af4fd9c2063a0cf56dc36e9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - varint >=1.0.2,<2.0
    - six >=1.10.0,<2.0
    - morphys >=1.0,<2.0
    - base58 >=1.0.2,<3.0
    - blake3 >=0.3.0,<2.0
    - mmh3 >=3.0.0,<6.0

test:
  imports:
    - multihash
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Multihash implementation in Python
  license: MIT
  license_file: LICENSE
  home: https://github.com/multiformats/py-multihash

extra:
  recipe-maintainers:
    - step21
